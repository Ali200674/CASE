<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P48 Marketing</title>
    <link rel="stylesheet" href="style.css" />
    <script src = "utils.js"></script>
    <script src = "events.js"></script>
    <script src = "table.js"></script>
    <script src = "dynamicClientSections.js"></script>
    <script src = "main.js" defer></script>
  </head>
  <body>
    <!-- NOTE: 
        This is for the clients name, it will be spaced
        out from the other text.
            Thought:
            Maybe later on it will be the user's name with the company
            name? (P48 Marketing : Anne)
         -->
    <header class="main-header">
      <img src="P48_Logo.png" alt="P48 Logo" class="header-logo">
      <h1 id="company-name"></h1>
    </header>
  

    <!-- Here is the section for adding in a new schedule. -->
    <div id="add-client">
      <select id="add-client-dropdown">
        <option>97.9 WNCI</option>
        <option>92.3 WCOL</option>
        <option>97.1 The Fan (WBNS)</option>
      </select>
      <button id="add-client-button">Add New Client</button>
    </div>

    <!-- This grays out the background when the confirm-section below is shown -->
    <div class = "overlay"></div>

    <!-- This is the confirm section -->
    <div class = "confirm-section">
      <p>Are you sure?</p>

      <button class = "yes-button">Yes</button>
      <button class = "no-button">No</button>
    </div>
    
  </body>
</html>
