<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P48 Marketing</title>
    <link rel="stylesheet" href="style.css" />
    <script src = "utils.js"></script>
    <script src = "events.js"></script>
    <script src = "table.js"></script>
    <script src = "dynamicClientSections.js"></script>
    <script src = "main.js" defer></script>
  </head>
  <body>
    <!-- NOTE: 
        This is for the clients name, it will be spaced
        out from the other text.
            Thought:
            Maybe later on it will be the user's name with the company
            name? (P48 Marketing : Anne)
         -->
    <h1 id="company-name">P48 Marketing</h1>

    <!-- NOTE:
            We need to generate this form dynamically with JS.
            Something just to remember later on.
        -->
    <!-- This is the form html as of now -->
    <div class = "section">
      <h2 class = "client-name">Radio Station One</h2>
      <div class="generate-new-schedule">
        <p>Type Of Schedule</p>

        <select class="type-schedule">
          <option value="week">Week</option>
          <option value="month">Month</option>
        </select>
         
        <!-- This div will hold all of the selections for the schedule making -->
          <div class = "date-selections">
            <span class = "error-message">Input Field(s) Cannot Be Empty!</span>
            <div class = "week-selection">
                <div class = "week-range">
                  <p>From:</p>
                  <input type="week" class = "from-week">
                  <p>To:</p>
                  <input type="week" class = "to-week">
                </div>
            </div>

            <div class = "month-selection">
              <p>Month:</p>
              <input type="month" class = "month-choosen">
            </div>
        </div>
        
        <button class = "make-schedule">Generate New Schedule</button>
      </div>
    </div>

    <!-- Here is the section for adding in a new schedule. -->
    <div id="add-client">
      <select id="add-client-dropdown">
        <option>Radio Station One</option>
        <option>Radio Station Two</option>
        <option>Radio Station Three</option>
      </select>
      <button id="add-client-button">Add New Client</button>
    </div>
  </body>
</html>
