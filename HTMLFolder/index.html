<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P48 Marketing</title>
    <link rel="stylesheet" href="/CSSFolder/style.css" />
    <!-- For calendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
    <script src = "/JSFolder/calendar.js" defer></script>
    
    <script src = "/JSFolder/utils.js"></script>
    <script src = "/JSFolder/events.js"></script>
    <script src = "/JSFolder/table.js"></script>
    <script src = "/JSFolder/dynamicClientSections.js"></script>
    <script src = "/JSFolder/main.js" defer></script>
  </head>
  <body>
    <!-- NOTE: 
        Added client Name and campaign start and end fields
         -->
    <header class="main-header">
      <img src="/Images/P48_Logo.png" alt="P48 Logo" class="header-logo">

      <input 
        id="client-name-input"
        class="header-client-name"
        type="text"
        placeholder="Client Name">

      <div class="header-field">
        <label for="campaign-start">Campaign Start</label>
        <input id="campaign-start" type="date">
      </div>

      <div class="header-field">
        <label for="campaign-end">Campaign End</label>
        <input id="campaign-end" type="date">
      </div>

      <!-- <h1 id="company-name"></h1> -->
    </header>
  

      <!-- Here is the section for adding in a new schedule. -->
    <div id="add-client">
      <!-- 
      i didn't want to delete this, i wanted to try a different way, lemme know what you think!
      <select id="add-client-dropdown">
        <option>97.9 WNCI</option>
        <option>92.3 WCOL</option>
        <option>97.1 The Fan (WBNS)</option>
      </select>
    -->
      <button id="add-client-button">Add New Table</button>
    </div>

    <!-- preliminary attempt at making a dropdown in the section-->
    <datalist id="station-list">
      <option value="97.9 WNCI">
      <option value="92.3 WCOL">
      <option value="97.1 The Fan (WBNS)">
    </datalist>
   
    <!-- This grays out the background when the confirm-section below is shown -->
    <div class = "overlay"></div>

    <!-- This is the confirm section -->
    <div class = "confirm-section">
      <p>Are you sure?</p>

      <button class = "yes-button">Yes</button>
      <button class = "no-button">No</button>
    </div>

    <div class = "check-section">
      <button class = "check-section-button"><img src="/Images/exit_button.svg" alt=""></button>
      <p></p>
    </div>

    <!-- This is for the calendar -->
    <div id = "calendar"></div>

  </body>
</html>
